<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AdminHaus{% endblock %}</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Poppins -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS Global AdminHaus -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/global.css') }}"
    >

</head>


<body>

    <main class="container-fluid min-vh-100 p-0">

        <div class="row min-vh-100 g-0">


            <!-- =====================================
                 SIDEBAR
                 ===================================== -->

            <aside class="col-12 col-lg-2 ah-bg-primary">

                <div class="h-100 d-flex flex-column p-3">


                    <!-- LOGO -->

                    <div class="d-flex justify-content-center mb-4">

                        <img
                            src="{{ url_for('static', filename='media/logo_oscuro-Photoroom.png') }}"
                            alt="AdminHaus"
                            class="img-fluid w-75"
                        >

                    </div>


                    <!-- DESCRIPCIÓN -->

                    <p class="ah-text-subtitulos ah-text-white mb-4">
                        Panel administrativo
                    </p>


                    <!-- =================================
                         MENÚ PRINCIPAL
                         ================================= -->

                    <nav>

                        <ul class="list-unstyled mb-0">


                            <!-- DASHBOARD -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('dashboard_admin') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'dashboard' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Dashboard
                                </a>

                            </li>


                            <!-- PROPIETARIOS -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('propietarios') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'propietarios' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Propietarios
                                </a>

                            </li>


                            <!-- INQUILINOS -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('inquilinos') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'inquilinos' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Inquilinos
                                </a>

                            </li>


                            <!-- PROPIEDADES -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('propiedades') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'propiedades' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Propiedades
                                </a>

                            </li>


                            <!-- CONTRATOS -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('contratos') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'contratos' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Contratos
                                </a>

                            </li>


                            <!-- PAGOS -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('pagos') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'pagos' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Pagos
                                </a>

                            </li>


                            <!-- MANTENIMIENTOS -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('mantenimientos') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'mantenimientos' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Mantenimientos
                                </a>

                            </li>


                            <!-- TÉCNICOS -->

                            <li class="mb-2">

                                <a
                                    href="{{ url_for('tecnicos') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'tecnicos' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Técnicos
                                </a>

                            </li>

                        </ul>

                    </nav>


                    <!-- SEPARADOR -->

                    <hr class="ah-divider mt-4 mb-4">


                    <!-- =================================
                         USUARIOS
                         ================================= -->

                    <div>

                        <span class="ah-text-peque ah-text-secondary">
                            USUARIOS
                        </span>


                        <ul class="list-unstyled mt-3 mb-0">

                            <li>

                                <a
                                    href="{{ url_for('usuarios') }}"
                                    class="
                                        d-block
                                        ah-text-white
                                        ah-text-regular-negrita
                                        rounded
                                        px-3
                                        py-2
                                        {% if request.endpoint == 'usuarios' %}
                                            ah-bg-primary-hover
                                        {% endif %}
                                    "
                                >
                                    Usuarios
                                </a>

                            </li>

                        </ul>

                    </div>

                </div>

            </aside>


            <!-- =====================================
                 CONTENIDO DE LA PÁGINA
                 ===================================== -->

            <section
                class="
                    col-12
                    col-lg-10
                    ah-bg-background
                    p-4
                    p-lg-5
                "
            >

                {% block content %}

                {% endblock %}

            </section>

        </div>

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
