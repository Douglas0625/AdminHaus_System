<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AdminHaus - Iniciar sesión</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Poppins -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS Global AdminHaus -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='/css/global.css') }}"
    >

</head>


<body>


    <main class="container-fluid min-vh-100 p-0">

        <div class="row min-vh-100 g-0">


            <!-- =====================================
                 PANEL IZQUIERDO
                 ===================================== -->

            <section class="col-12 col-lg-5 ah-bg-primary">

                <div class="h-100 d-flex flex-column p-5">


                    <div>

                        <h2 class="ah-text-grande ah-text-white mb-1">
                            AdminHaus
                        </h2>

                        <p class="ah-text-subtitulos ah-text-white mb-0">
                            Gestión inmobiliaria simple y centralizada.
                        </p>

                    </div>


                    <!-- LOGO -->

                    <div
                        class="
                            flex-grow-1
                            d-flex
                            justify-content-center
                            align-items-center
                        "
                    >

                        <img
                            src="{{ url_for('static', filename='/media/logo_oscuro-Photoroom.png') }}"
                            alt="AdminHaus - Gestión de propiedades"
                            class="img-fluid"
                        >

                    </div>

                </div>

            </section>



            <!-- =====================================
                 PANEL DERECHO
                 ===================================== -->

            <section
                class="
                    col-12
                    col-lg-7
                    d-flex
                    justify-content-center
                    align-items-center
                    p-4
                    ah-bg-background
                "
            >


                <!-- CARD LOGIN -->

                <div
                    class="ah-card w-100"
                    style="max-width: 500px;"
                >

                    <div class="p-4">


                        <!-- ENCABEZADO -->

                        <div class="mb-4">

                            <h2 class="ah-text-grande ah-text-primary mb-1">
                                Bienvenido
                            </h2>

                            <p class="ah-text-subtitulos ah-text-secondary mb-0">
                                Ingresa tus credenciales para continuar
                            </p>

                        </div>



                        <!-- FORMULARIO -->

                        <form
                            method="POST"
                            action="{{ url_for('login') }}"
                        >


                            <!-- USUARIO -->

                            <div class="mb-3">

                                <label
                                    for="usuario"
                                    class="ah-form-label"
                                >
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    id="usuario"
                                    name="usuario"
                                    class="ah-form-control"
                                    placeholder="Ingresa tu usuario"
                                    autocomplete="username"
                                >

                            </div>



                            <!-- CONTRASEÑA -->

                            <div class="mb-3">

                                <label
                                    for="contrasena"
                                    class="ah-form-label"
                                >
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    id="contrasena"
                                    name="contrasena"
                                    class="ah-form-control"
                                    placeholder="Ingresa tu contraseña"
                                    autocomplete="current-password"
                                >

                            </div>



                            <!-- BOTÓN -->

                            <div class="d-grid mb-3">

                                <button
                                    type="submit"
                                    class="ah-btn-primary"
                                >
                                    Iniciar sesión
                                </button>

                            </div>



                            <!-- PERMISOS -->

                            <p class="ah-text-regular ah-text-secondary mb-4">
                                Acceso según tu rol y permisos
                            </p>


                        </form>



                        <!-- PIE -->

                        <div class="text-center">

                            <p class="ah-text-peque ah-text-secondary mb-0">
                                AdminHaus · Plataforma de gestión inmobiliaria
                            </p>

                        </div>


                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
